<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>
<style>
body { text-align:center; font-family:Arial; }
input, select, button { padding:10px; margin:5px; width:250px; }
</style>
</head>

<body>

<h2>Create Account</h2>

<select id="role">
<option>Patient</option>
<option>Doctor</option>
<option>Admin</option>
</select><br>

<input type="text" id="name" placeholder="Name"><br>
<input type="text" id="phone" placeholder="Phone Number"><br>
<input type="email" id="email" placeholder="Email ID"><br>

<input type="text" id="extra" placeholder="Specialization (Only for Doctor)"><br>

<button onclick="createAccount()">Create Account</button>

<h3 id="result"></h3>

<script>

function createAccount(){

let role = document.getElementById("role").value;
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let email = document.getElementById("email").value;
let extra = document.getElementById("extra").value;

// Generate ID
let id = role.substring(0,3).toUpperCase() + Math.floor(Math.random()*10000);

// Create object
let user = {
    id: id,
    name: name,
    phone: phone,
    email: email,
    role: role,
    extra: extra
};

// Save in LocalStorage
localStorage.setItem(id, JSON.stringify(user));

document.getElementById("result").innerHTML =
"Account Created!<br>Your ID: <b>" + id + "</b>";

}

</script>

</body>
</html>
