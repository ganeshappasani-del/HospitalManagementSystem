<!DOCTYPE html>
<html>
<head>
<title>Hospital Management System</title>

<style>

body{
    font-family: Arial;
    padding:0;
    height:100vh;
    background:linear-gradient(135deg,#a8edea,#fed6e3);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:400px;
}

h1{
    color:#333;
    margin-bottom:30px;
}

button{
    width:80%;
    padding:12px;
    margin:10px;
    font-size:16px;
    background:linear-gradient(45deg,#ffcc00,#ff9900);
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
    background:linear-gradient(45deg,#ff9900,#ff6600);
    color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>Hospital Management System</h1>

<button onclick="goToLogin('Patient')">Patient Login</button>
<button onclick="goToLogin('Doctor')">Doctor Login</button>
<button onclick="goToLogin('Admin')">Admin Login</button>

<button onclick="goToCreate()">Create Account</button>
</div>

<script>

function goToLogin(role){
    window.location.href = "login.html?role=" + role;
}
function goToCreate(){
    window.location.href = "ACCOUNT.html";
}

</script>

</body>
</html>
